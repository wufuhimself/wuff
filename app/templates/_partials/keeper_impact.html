{% if keeper_impact %}
{% for impact in keeper_impact %}
<div style="border: 1px solid var(--border); border-radius: 8px; padding: 1rem; background: var(--surface-alt); text-align: center;">
  <div style="font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; color: var(--purple-light); margin-bottom: 0.5rem;">
    <span class="pill pos-{{ impact.position.lower() }}" style="font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 0.4rem 0.7rem;">{{ impact.position }}</span>
  </div>
  <div style="font-size: clamp(1rem, 3vw, 1.3rem); margin-bottom: 0.5rem;">
    <span style="color: var(--green); font-weight: 600;">{{ impact.kept }}</span>
    <span style="color: var(--muted);">of top {{ impact.elite_tier }}</span>
    kept
  </div>
  <div style="font-size: clamp(0.9rem, 2.5vw, 1rem); color: var(--purple-light); font-weight: 600; margin-bottom: 0.3rem;">
    {{ impact.available }} available
  </div>
  <div style="font-size: clamp(0.75rem, 2vw, 0.85rem); color: var(--muted);">
    {{ impact.pct_kept }}% locked via keepers
  </div>
</div>
{% endfor %}
{% endif %}
