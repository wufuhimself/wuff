<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Yahoo Fantasy Dashboard{% endblock %}</title>
    <style>
      :root {
        --navy: #0a2f5c;
        --navy-dark: #071f3d;
        --blue: #0065ff;
        --border: #e6e8ee;
        --text: #1a1d26;
        --muted: #667085;
        --bg: #f2f4f8;
      }
      * { box-sizing: border-box; }
      html { font-size: 16px; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
      header { background: linear-gradient(135deg, var(--navy), var(--navy-dark)); color: white; padding: 1rem 1rem; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
      header h1 { margin: 0 0 0.5rem 0; font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 700; letter-spacing: -0.01em; }
      nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
      nav a { color: #cfe0ff; text-decoration: none; font-size: clamp(0.75rem, 2.5vw, 0.95rem); font-weight: 600; padding: 0.5rem 0.7rem; border-radius: 6px; transition: background .15s, color .15s; }
      nav a:hover { background: rgba(255,255,255,.1); color: white; }
      nav a.active { background: rgba(255,255,255,.2); color: white; }
      main { padding: 1rem; max-width: 1200px; margin: 0 auto; }
      .card { background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-bottom: 1.25rem; padding: 1rem; overflow-x: auto; }
      .card h2 { margin-top: 0; font-size: clamp(1rem, 4vw, 1.25rem); }
      .card h2:first-child, .card h3:first-child { margin-top: 0; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .grid-two { display: grid; gap: 1rem; grid-template-columns: 1fr; }
      .table { width: 100%; border-collapse: collapse; font-size: clamp(0.8rem, 2vw, 0.9rem); }
      .table th, .table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: top; }
      .table th { position: sticky; top: 0; background: #fafbfc; color: var(--muted); font-size: clamp(0.7rem, 1.5vw, 0.85rem); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
      .table tbody tr:hover { background: #fafbfc; }
      .table td.wrap { white-space: normal; min-width: 140px; }
      .table td.note-col { white-space: normal; min-width: 180px; max-width: 300px; color: var(--muted); font-size: clamp(0.8rem, 2vw, 0.92rem); }
      .table.compact th, .table.compact td { padding: 0.35rem 0.4rem; font-size: clamp(0.75rem, 1.8vw, 0.85rem); }
      .table.compact thead { position: sticky; top: 0; background: #fafbfc; }
      .table td.number { text-align: right; font-variant-numeric: tabular-nums; }
      .table td.playerName { white-space: normal; min-width: 100px; max-width: 140px; }
      .table td.positive { color: #15803d; font-weight: 600; }
      .table td.negative { color: #991b1b; font-weight: 600; }
      .table tr.my-pick { background: #fff8e6; }
      .table tr.my-pick td { font-weight: 600; }
      .table tr.my-pick:hover { background: #fff2cc; }
      .table tr.round-divider td { background: #eef1f7; font-weight: 700; color: #333; padding: 0.4rem 0.6rem; white-space: nowrap; }
      .table tbody tr:nth-child(odd) { background: #fafbfc; }
      .table tbody tr:nth-child(even) { background: white; }
      .table tbody tr:hover { background: #eff3ff; }
      .pill.pos-qb { background: #dbeafe; color: #1e40af; }
      .pill.pos-rb { background: #dcfce7; color: #15803d; }
      .pill.pos-wr { background: #f3e8ff; color: #6b21a8; }
      .pill.pos-te { background: #fed7aa; color: #9a3412; }
      .pill.pos-k { background: #fef3c7; color: #92400e; }
      .pill.pos-def { background: #fecaca; color: #991b1b; }
      .button { background: var(--blue); border: none; color: white; padding: 0.65rem 1.1rem; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; font-size: clamp(0.9rem, 2vw, 1rem); transition: background .15s; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      .button:hover:not(:disabled) { background: #0052cc; }
      .button:disabled { opacity: 0.45; cursor: not-allowed; }
      .status { color: var(--muted); margin-top: 0.5rem; font-size: clamp(0.8rem, 2vw, 0.92rem); }
      .message { background: #e7f3ff; color: #0b3d91; border-left: 4px solid var(--blue); padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
      .error { background: #fdeceb; color: #8a1f11; border-left: 4px solid #d64541; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
      .pill { display: inline-block; background: #eef1f7; color: #444; border-radius: 999px; padding: 0.25rem 0.6rem; font-size: clamp(0.65rem, 1.5vw, 0.8rem); margin-right: 0.35rem; font-weight: 600; white-space: nowrap; }
      .team-list { list-style: none; padding: 0; margin: 0; }
      .team-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: clamp(0.9rem, 2vw, 1rem); }
      .team-list li:last-child { border-bottom: none; }
      .round-block { margin-bottom: 1rem; }
      .round-block h3 { margin-bottom: 0.4rem; font-size: clamp(1rem, 3vw, 1.1rem); }
      .year-links a { margin-right: 0.75rem; }
      select, input[type="text"], input[type="file"] { font: inherit; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; background: white; font-size: clamp(0.9rem, 2vw, 1rem); min-height: 44px; }
      code { background: #f0f1f5; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.9em; }
      @media (max-width: 640px) {
        header { padding: 0.75rem 0.5rem; }
        header h1 { margin-bottom: 0.5rem; }
        nav { gap: 0.15rem; }
        nav a { padding: 0.4rem 0.5rem; }
        main { padding: 0.75rem; }
        .card { padding: 0.75rem; margin-bottom: 1rem; }
        .grid-two { grid-template-columns: 1fr; }
        .table th, .table td { padding: 0.35rem 0.4rem; }
        .table.compact th, .table.compact td { padding: 0.3rem 0.35rem; }
      }
      @media (min-width: 641px) {
        .grid-two { grid-template-columns: repeat(2, 1fr); }
        main { padding: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Frank Gore Memorial League</h1>
      <nav>
        <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
        <a href="/keepers-board" class="{{ 'active' if active == 'keepers-board' }}">Keepers board</a>
        <a href="/mock-draft" class="{{ 'active' if active == 'mock-draft' }}">Mock draft</a>
        <a href="/draft-history" class="{{ 'active' if active == 'draft-history' }}">Draft history</a>
        <a href="/standings" class="{{ 'active' if active == 'standings' }}">Standings</a>
        <a href="/settings" class="{{ 'active' if active == 'settings' }}">Settings</a>
      </nav>
    </header>
    <main>
      {% if message %}<div class="message">{{ message }}</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
