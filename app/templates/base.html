<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Yahoo Fantasy Dashboard{% endblock %}</title>
    <style>
      :root {
        --navy: #0a2f5c;
        --navy-dark: #071f3d;
        --blue: #0065ff;
        --border: #e6e8ee;
        --text: #1a1d26;
        --muted: #667085;
        --bg: #f2f4f8;
      }
      * { box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); line-height: 1.45; }
      header { background: linear-gradient(135deg, var(--navy), var(--navy-dark)); color: white; padding: 1.5rem 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
      header h1 { margin: 0 0 0.75rem 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
      nav { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      nav a { color: #cfe0ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; padding: 0.4rem 0.85rem; border-radius: 8px; transition: background .15s, color .15s; }
      nav a:hover { background: rgba(255,255,255,.1); color: white; }
      nav a.active { background: rgba(255,255,255,.16); color: white; }
      main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
      .card { background: white; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); margin-bottom: 1.5rem; padding: 1.5rem; overflow-x: auto; }
      .card h2 { margin-top: 0; font-size: 1.1rem; }
      .card h2:first-child, .card h3:first-child { margin-top: 0; }
      .grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: top; }
      .table th { position: sticky; top: 0; background: #fafbfc; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
      .table tbody tr:hover { background: #fafbfc; }
      .table td.wrap { white-space: normal; }
      .table td.note-col { white-space: normal; min-width: 220px; max-width: 360px; color: var(--muted); font-size: 0.92rem; }
      .table tr.my-pick { background: #fff8e6; }
      .table tr.my-pick td { font-weight: 600; }
      .table tr.my-pick:hover { background: #fff2cc; }
      .table tr.round-divider td { background: #eef1f7; font-weight: 700; color: #333; padding: 0.45rem 0.9rem; white-space: nowrap; }
      .button { background: var(--blue); border: none; color: white; padding: 0.65rem 1.1rem; border-radius: 10px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; font-size: 0.92rem; transition: background .15s; }
      .button:hover:not(:disabled) { background: #0052cc; }
      .button:disabled { opacity: 0.45; cursor: not-allowed; }
      .status { color: var(--muted); margin-top: 0.5rem; font-size: 0.92rem; }
      .message { background: #e7f3ff; color: #0b3d91; border-left: 4px solid var(--blue); padding: 1rem; margin-bottom: 1rem; border-radius: 10px; }
      .error { background: #fdeceb; color: #8a1f11; border-left: 4px solid #d64541; padding: 1rem; margin-bottom: 1rem; border-radius: 10px; }
      .pill { display: inline-block; background: #eef1f7; color: #444; border-radius: 999px; padding: 0.18rem 0.65rem; font-size: 0.78rem; margin-right: 0.35rem; font-weight: 600; }
      .team-list { list-style: none; padding: 0; margin: 0; }
      .team-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
      .team-list li:last-child { border-bottom: none; }
      .round-block { margin-bottom: 1rem; }
      .round-block h3 { margin-bottom: 0.4rem; }
      .year-links a { margin-right: 0.75rem; }
      select, input[type="text"], input[type="file"] { font: inherit; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 8px; background: white; }
      code { background: #f0f1f5; padding: 0.1rem 0.4rem; border-radius: 5px; font-size: 0.88em; }
    </style>
  </head>
  <body>
    <header>
      <h1>Frank Gore Memorial League</h1>
      <nav>
        <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
        <a href="/keepers-board" class="{{ 'active' if active == 'keepers-board' }}">Keepers board</a>
        <a href="/gems" class="{{ 'active' if active == 'gems' }}">Gem Finder</a>
        <a href="/draft-history" class="{{ 'active' if active == 'draft-history' }}">Draft history</a>
        <a href="/standings" class="{{ 'active' if active == 'standings' }}">Standings</a>
      </nav>
    </header>
    <main>
      {% if message %}<div class="message">{{ message }}</div>{% endif %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
