{% macro keeper_toggle(team, player, kept, league_slug='', position='', pos_rank='', ranking=none, locked=false) %}
{% if locked %}
<div class="keeper-card keeper-card-kept keeper-card-locked" title="Locked keeper -- can't be changed here">
  <span class="pill pos-{{ (position or '').lower() }}">{{ pos_rank or position }}</span>
  <strong>{{ player }}</strong>
  {% if ranking %}<span class="status" style="display:inline;">#{{ ranking }}</span>{% endif %}
  <span class="status" style="display:inline; margin-left:0.35rem;">🔒 locked</span>
</div>
{% else %}
<button type="button"
        class="js-keeper-toggle keeper-card{{ ' keeper-card-kept' if kept else '' }}"
        data-team="{{ team }}"
        data-player="{{ player }}"
        data-kept="{{ '1' if kept else '0' }}"
        data-league-slug="{{ league_slug }}"
        title="{{ 'Click to drop as keeper' if kept else 'Click to make this the keeper' }}">
  <span class="pill pos-{{ (position or '').lower() }}">{{ pos_rank or position }}</span>
  <strong>{{ player }}</strong>
  {% if ranking %}<span class="status" style="display:inline;">#{{ ranking }}</span>{% endif %}
</button>
{% endif %}
{% endmacro %}
