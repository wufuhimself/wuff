{% macro keeper_toggle(team, player, kept, league_slug='') %}
<button type="button"
        class="js-keeper-toggle pill{{ ' pill-kept' if kept else ' pill-add' }}"
        data-team="{{ team }}"
        data-player="{{ player }}"
        data-kept="{{ '1' if kept else '0' }}"
        data-league-slug="{{ league_slug }}"
        title="{{ 'Click to remove as keeper' if kept else 'Click to make this the keeper' }}">
  {{ '★ kept' if kept else '+ keep' }}
</button>
{% endmacro %}
