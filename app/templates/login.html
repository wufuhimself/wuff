{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
      <section class="card">
        <h2>Log in</h2>
        <p class="status">Dev login — email only, no password or verification yet. Real sign-in (magic link / Google) replaces this before any public deploy.</p>
        {% if error %}<div class="message">{{ error }}</div>{% endif %}
        <form method="post">
          <input type="email" name="email" placeholder="you@example.com" required>
          <button type="submit">Log in</button>
        </form>
      </section>
{% endblock %}
