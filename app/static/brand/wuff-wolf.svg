<svg width="460" height="460" viewBox="0 0 460 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wuff geometric wolf">
  <defs>
    <rect id="frame" x="30" y="30" width="400" height="400" rx="64"/>
    <linearGradient id="fur" x1="210" y1="60" x2="210" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAE4F7"/><stop offset="1" stop-color="#B79FE2"/>
    </linearGradient>
  </defs>
  <use href="#frame" fill="#1b1622" stroke="#2a1b48" stroke-width="34"/>
  <use href="#frame" fill="none" stroke="#b285ff" stroke-width="16"/>
  <use href="#frame" fill="none" stroke="#6b3fd4" stroke-width="6"/>

  <g transform="translate(20 21)">
  <!-- Head silhouette -->
  <path d="M108 58 L165 150 L210 120 L255 150 L312 58 L316 208 L290 262 L245 332 L210 358 L175 332 L130 262 L104 208 Z"
        fill="url(#fur)" stroke="#2a1b48" stroke-width="7" stroke-linejoin="round"/>
  <!-- Faceted shading -->
  <path d="M108 58 L165 150 L104 208 Z" fill="#A98FD6"/>
  <path d="M312 58 L255 150 L316 208 Z" fill="#A98FD6"/>
  <path d="M210 120 L196 222 L210 300 L224 222 Z" fill="#F5F1FC"/>
  <path d="M196 222 L210 300 L175 332 L130 262 Z" fill="#C6B7E9"/>
  <path d="M224 222 L210 300 L245 332 L290 262 Z" fill="#C6B7E9"/>
  <!-- re-stroke silhouette on top so facets stay inside crisp outline -->
  <path d="M108 58 L165 150 L210 120 L255 150 L312 58 L316 208 L290 262 L245 332 L210 358 L175 332 L130 262 L104 208 Z"
        fill="none" stroke="#2a1b48" stroke-width="7" stroke-linejoin="round"/>

  <!-- Eyes -->
  <path d="M150 202 L184 196 L172 222 Z" fill="#ff5ca8"/>
  <path d="M270 202 L236 196 L248 222 Z" fill="#ff5ca8"/>
  <!-- Pupils (lowered to the bottom of the eyes) -->
  <path d="M164 209 L179 207 L172 221 Z" fill="#2a1b48"/>
  <path d="M256 209 L241 207 L248 221 Z" fill="#2a1b48"/>
  <!-- Angry brows (steeper angle) -->
  <path d="M150 168 L188 186 L187 193 L151 175 Z" fill="#2a1b48"/>
  <path d="M270 168 L232 186 L233 193 L269 175 Z" fill="#2a1b48"/>
  <!-- Nose -->
  <path d="M196 300 L224 300 L210 322 Z" fill="#2a1b48"/>
  </g>
</svg>
